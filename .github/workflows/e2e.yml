on:
  pull_request:
  push:
    branches:
      - dev
      - release-*
      - dev-*

name: E2E

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false


jobs:
  paths-filter:
    name: E2E-Path-Filter
    runs-on: ubuntu-latest
    outputs:
      not-ignore: ${{ steps.filter.outputs.not-ignore }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d
        id: filter
        with:
          filters: |
            not-ignore:
              - '!**/*.md'
  license-header:
    name: License header
    runs-on: ubuntu-latest
    if: ${{ (needs.paths-filter.outputs.not-ignore == 'true') || (github.event_name == 'push') }}
    needs: paths-filter
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Check license header
        uses: apache/skywalking-eyes/header@main
  code-style:
    if: github.repository == 'apache/streampark'
    name: Code style
    runs-on: ubuntu-latest
    needs: license-header
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Check codestyle
        run: ./mvnw -B -q -nsu checkstyle:check spotless:check
  build:
    name: E2E-Build
    runs-on: ubuntu-latest
    needs: code-style
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: 11
          distribution: 'adopt'
      - name: Cache local Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}-e2e
          restore-keys: ${{ runner.os }}-maven-
      - name: Build Image
        run: |
          ./build.sh \
          && docker build -f docker/Dockerfile . -t apache/streampark:ci
      - name: Export Docker Images
        run: |
          docker save apache/streampark:ci -o /tmp/standalone-image.tar \
          && du -sh /tmp/standalone-image.tar
      - uses: actions/upload-artifact@v4
        name: Upload Docker Images
        with:
          name: standalone-image
          path: /tmp/standalone-image.tar
          retention-days: 1
  api-e2e:
    name: API-${{ matrix.case.name }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        case:
          - name: EnvironmentTest
            class: org.apache.streampark.e2e.cases.EnvironmentTest
          - name: AlarmTest
            class: org.apache.streampark.e2e.cases.AlarmTest
          - name: UserManagementTest
            class: org.apache.streampark.e2e.cases.UserManagementTest
          - name: RoleManagementTest
            class: org.apache.streampark.e2e.cases.RoleManagementTest
          - name: TeamManagementTest
            class: org.apache.streampark.e2e.cases.TeamManagementTest
          - name: MemberManagementTest
            class: org.apache.streampark.e2e.cases.MemberManagementTest
          - name: ExternalLinkTest
            class: org.apache.streampark.e2e.cases.ExternalLinkTest
          - name: YarnQueueTest
            class: org.apache.streampark.e2e.cases.YarnQueueTest
          - name: TokenManagementTest
            class: org.apache.streampark.e2e.cases.TokenManagementTest
          - name: UploadManagementTest
            class: org.apache.streampark.e2e.cases.UploadManagementTest
          - name: ProjectsManagementTest
            class: org.apache.streampark.e2e.cases.ProjectsManagementTest
          - name: VariableManagementTest
            class: org.apache.streampark.e2e.cases.VariableManagementTest

          # Flink remote cluster (API)
          - name: Flink117-RemoteDeploy
            class: org.apache.streampark.e2e.cases.Flink117OnRemoteClusterDeployTest
          - name: Flink118-RemoteDeploy
            class: org.apache.streampark.e2e.cases.Flink118OnRemoteClusterDeployTest
          - name: Flink119-RemoteDeploy
            class: org.apache.streampark.e2e.cases.Flink119OnRemoteClusterDeployTest
          - name: Flink120-RemoteDeploy
            class: org.apache.streampark.e2e.cases.Flink120OnRemoteClusterDeployTest
          - name: Flink200-RemoteDeploy
            class: org.apache.streampark.e2e.cases.Flink200OnRemoteClusterDeployTest
          - name: Flink210-RemoteDeploy
            class: org.apache.streampark.e2e.cases.Flink210OnRemoteClusterDeployTest
          - name: Flink220-RemoteDeploy
            class: org.apache.streampark.e2e.cases.Flink220OnRemoteClusterDeployTest
          - name: Flink230-RemoteDeploy
            class: org.apache.streampark.e2e.cases.Flink230OnRemoteClusterDeployTest

          # Flink yarn cluster (API)
          - name: Flink117-YarnClusterDeploy
            class: org.apache.streampark.e2e.cases.Flink117OnYarnClusterDeployTest
          - name: Flink118-YarnClusterDeploy
            class: org.apache.streampark.e2e.cases.Flink118OnYarnClusterDeployTest
          - name: Flink119-YarnClusterDeploy
            class: org.apache.streampark.e2e.cases.Flink119OnYarnClusterDeployTest
          - name: Flink120-YarnClusterDeploy
            class: org.apache.streampark.e2e.cases.Flink120OnYarnClusterDeployTest
          - name: Flink200-YarnClusterDeploy
            class: org.apache.streampark.e2e.cases.Flink200OnYarnClusterDeployTest
          - name: Flink210-YarnClusterDeploy
            class: org.apache.streampark.e2e.cases.Flink210OnYarnClusterDeployTest
          - name: Flink220-YarnClusterDeploy
            class: org.apache.streampark.e2e.cases.Flink220OnYarnClusterDeployTest
          - name: Flink230-YarnClusterDeploy
            class: org.apache.streampark.e2e.cases.Flink230OnYarnClusterDeployTest

          # Flink SQL on Yarn (API)
          - name: FlinkSQL117-Yarn
            class: org.apache.streampark.e2e.cases.FlinkSQL117OnYarnTest
          - name: FlinkSQL118-Yarn
            class: org.apache.streampark.e2e.cases.FlinkSQL118OnYarnTest
          - name: FlinkSQL119-Yarn
            class: org.apache.streampark.e2e.cases.FlinkSQL119OnYarnTest
          - name: FlinkSQL120-Yarn
            class: org.apache.streampark.e2e.cases.FlinkSQL120OnYarnTest
          - name: FlinkSQL200-Yarn
            class: org.apache.streampark.e2e.cases.FlinkSQL200OnYarnTest
          - name: FlinkSQL210-Yarn
            class: org.apache.streampark.e2e.cases.FlinkSQL210OnYarnTest
          - name: FlinkSQL220-Yarn
            class: org.apache.streampark.e2e.cases.FlinkSQL220OnYarnTest
          - name: FlinkSQL230-Yarn
            class: org.apache.streampark.e2e.cases.FlinkSQL230OnYarnTest

          # Flink K8s cluster (API)
          - name: Flink117-K8sClusterDeploy
            class: org.apache.streampark.e2e.cases.Flink117OnK8sClusterDeployTest
          - name: Flink118-K8sClusterDeploy
            class: org.apache.streampark.e2e.cases.Flink118OnK8sClusterDeployTest
          - name: Flink119-K8sClusterDeploy
            class: org.apache.streampark.e2e.cases.Flink119OnK8sClusterDeployTest
          - name: Flink120-K8sClusterDeploy
            class: org.apache.streampark.e2e.cases.Flink120OnK8sClusterDeployTest
          - name: Flink200-K8sClusterDeploy
            class: org.apache.streampark.e2e.cases.Flink200OnK8sClusterDeployTest
          - name: Flink210-K8sClusterDeploy
            class: org.apache.streampark.e2e.cases.Flink210OnK8sClusterDeployTest
          - name: Flink220-K8sClusterDeploy
            class: org.apache.streampark.e2e.cases.Flink220OnK8sClusterDeployTest
          - name: Flink230-K8sClusterDeploy
            class: org.apache.streampark.e2e.cases.Flink230OnK8sClusterDeployTest

          # Flink SQL on K8s (API)
          - name: FlinkSQL117-K8s
            class: org.apache.streampark.e2e.cases.FlinkSQL117OnK8sTest
          - name: FlinkSQL118-K8s
            class: org.apache.streampark.e2e.cases.FlinkSQL118OnK8sTest
          - name: FlinkSQL119-K8s
            class: org.apache.streampark.e2e.cases.FlinkSQL119OnK8sTest
          - name: FlinkSQL120-K8s
            class: org.apache.streampark.e2e.cases.FlinkSQL120OnK8sTest
          - name: FlinkSQL200-K8s
            class: org.apache.streampark.e2e.cases.FlinkSQL200OnK8sTest
          - name: FlinkSQL210-K8s
            class: org.apache.streampark.e2e.cases.FlinkSQL210OnK8sTest
          - name: FlinkSQL220-K8s
            class: org.apache.streampark.e2e.cases.FlinkSQL220OnK8sTest
          - name: FlinkSQL230-K8s
            class: org.apache.streampark.e2e.cases.FlinkSQL230OnK8sTest
    steps:
      - name: Free Disk Space
        if: contains(matrix.case.name, 'Flink')
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          dotnet: true
          android: true
          haskell: true
          codeql: true
          docker-images: true
          large-packages: true
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: 11
          distribution: 'adopt'
      - name: Collect Workflow Telemetry
        uses: ./.github/actions/workflow-telemetry-action
        with:
          comment_on_pr: false
      - name: Cache local Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}-e2e
          restore-keys: ${{ runner.os }}-maven-
      - uses: actions/download-artifact@v4
        name: Download Docker Images
        with:
          name: standalone-image
          path: /tmp
      - name: Load Docker Images
        run: |
          docker load -i /tmp/standalone-image.tar \
          && rm -f /tmp/standalone-image.tar
      - name: Pre-pull Testcontainers images
        run: |
          pull_with_retry() {
            local image="$1"
            for attempt in $(seq 1 8); do
              if docker pull "$image"; then
                return 0
              fi
              echo "Failed to pull $image (attempt $attempt), retrying in ${attempt}0s..."
              sleep $((attempt * 10))
            done
            echo "Failed to pull $image after 8 attempts"
            return 1
          }
          pull_with_retry testcontainers/ryuk:0.7.0
          pull_with_retry rancher/k3s:v1.30.5-k3s1 || true
      - name: Run API Test
        run: |
          ./mvnw -B -f streampark-e2e/pom.xml -am \
            -DfailIfNoTests=false \
            -Dtest=${{ matrix.case.class }} test
      - uses: actions/upload-artifact@v4
        if: always()
        name: Upload Projects Build Logs
        with:
          name: ${{ matrix.case.name }}-projects-build-logs
          path: ~/streampark_build_logs
          retention-days: 1
  result:
    name: E2E - Result
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [ paths-filter, license-header, code-style, build, api-e2e ]
    if: always()
    steps:
      - name: Status
        run: |
          if [[ ${{ needs.paths-filter.outputs.not-ignore }} == 'false' && ${{ github.event_name }} == 'pull_request' ]]; then
            echo "Skip E2E!"
            exit 0
          fi
          if [[ ${{ needs.api-e2e.result }} != 'success' ]]; then
            echo "E2E Failed!"
            exit 1
          fi
